name: Linux GitHub CI

on: [pull_request]

env:
  MAVEN_OPTS: -Dmaven.wagon.httpconnectionManager.ttlSeconds=25 -Dmaven.wagon.http.retryHandler.count=3

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [ubuntu-24.04]
    strategy:
      matrix:
        jdk: [17, 21, 25]
    steps:
    - uses: actions/checkout@v7
      cache: maven
    - name: Set up JDK ${{ matrix.jdk }}
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.jdk }}
    - name: Setup python for docs
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'
        cache: 'pip' # caching pip dependencies from requirements.txt below
    - name: Setup python pip requirements for building docs
      working-directory: docs
      run: |
        pip install -r requirements.txt
    - name: Disable checksum offloading
      # See: https://github.com/actions/virtual-environments/issues/1187#issuecomment-686735760
      run: sudo ethtool -K eth0 tx off rx off
    - name: Build with Maven (JDK ${{ matrix.jdk }})
      run: |
        mvn -B clean install -Dspotless.apply.skip=true -Dall -T1C -U -Plinux-github-build --file pom.xml
    - name: Build Saxon specific parts with Maven (JDK ${{ matrix.jdk }})
      run: |
        pushd module/extensions/xsd
        mvn -B clean install -Dspotless.apply.skip=true -Dall -T1C -U -Plinux-github-build -Psaxon --file pom.xml
        popd
    - name: Remove SNAPSHOT jars from repository
      run: |
        find ~/.m2/repository -name "*SNAPSHOT*" -type d | xargs rm -rf {}
